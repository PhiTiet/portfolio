name: runtime-security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25'
      - name: Build runtime trust-store test image
        run: |
          mkdir -p target
          touch target/portfolio.jar
          docker build --pull -t runtime-security .
      - name: Verify default Java TLS validation
        run: |
          probe=$(mktemp -d)
          cat > "$probe/TrustProbe.java" <<'JAVA'
          import java.net.URI;
          import java.security.cert.CertPathBuilderException;
          import java.security.cert.CertPathValidatorException;
          import javax.net.ssl.HttpsURLConnection;
          import javax.net.ssl.SSLHandshakeException;

          public class TrustProbe {
              static void connect(String host) throws Exception {
                  var connection = (HttpsURLConnection) URI.create("https://" + host + "/").toURL().openConnection();
                  connection.setConnectTimeout(10000);
                  connection.setReadTimeout(10000);
                  try {
                      connection.connect();
                  } finally {
                      connection.disconnect();
                  }
              }

              public static void main(String[] args) throws Exception {
                  if (Runtime.version().feature() != 27) throw new AssertionError("Expected Java 27");
                  connect("example.com");
                  for (var prefix : new String[]{"dv-g3b", "dv-g3c", "ov-g3b", "ov-g3c", "ev-g3b", "ev-g3c", "dv-g3b-aaa", "dv-g3c-aaa", "ov-g3b-aaa", "ov-g3c-aaa", "ev-g3b-aaa", "ev-g3c-aaa", "dv-g3b-noct", "dv-g3b-aaa-noct"}) {
                      var host = prefix + "-emudhra.we-have-a-problem.com";
                      try {
                          connect(host);
                      } catch (SSLHandshakeException failure) {
                          Throwable cause = failure;
                          while (cause != null && !(cause instanceof CertPathBuilderException) && !(cause instanceof CertPathValidatorException)) cause = cause.getCause();
                          if (cause == null) throw failure;
                          System.out.println("Rejected compromised chain: " + host);
                          continue;
                      }
                      throw new AssertionError("Trusted compromised chain: " + host);
                  }
              }
          }
          JAVA
          javac --release 21 "$probe/TrustProbe.java"
          docker run --rm --entrypoint java -v "$probe:/tmp/probe:ro" runtime-security -cp /tmp/probe TrustProbe
