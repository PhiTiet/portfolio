        en me aanpassen aan hun manier van werken.
      start: 01-07-2022
      end: 01-04-2024
      icon:
        classes: fa-solid fa-laptop-code
        style: "color: #cc0f5b;"

    - employer: Rabobank
      job-title: Medior Software Engineer
      description: >-
        Ik bouwde en onderhield services voor MED, een hypotheekdashboard waarmee adviseurs en klanten
        hypotheken kunnen plannen, documenten delen, de voortgang volgen en contact houden. Werken in een
        microservices-omgeving gaf me ook praktische ervaring met Kubernetes, Azure en DevOps.
      start: 01-09-2022
      end: 01-04-2024
      icon:
        classes: fa-solid fa-piggy-bank fa-shake
        style: "color: #e49bd0;"

    - employer: Qualogy
      job-title: Senior Software Engineer
      description: >-
        Ik begon bij Qualogy als Senior Software Engineer, met mijn eerste opdracht bij Ahold Delhaize.
        Naast klantopdrachten heb ik bijgedragen aan interne projecten, meegeholpen bij het beoordelen van
        kandidaten via gesprekken en programmeeropdrachten, en kennissessies georganiseerd.
      start: 01-04-2024
      end:
      icon:
        classes: fa-solid fa-q
        style: "color: #b91d1d;"

    - employer: Ahold Delhaize
      job-title: Senior Software Engineer
      highlight:
        summary: Ik werd geselecteerd als core developer om ons cloudlandschap te helpen herstellen tijdens de storing bij Albert Heijn in oktober 2026.
        responsibilities:
          - Kwetsbaarheden mitigeren
          - Secrets roteren
          - Services op- en afschalen
          - Connectiviteit binnen Kubernetes herstellen
          - Afstemmen met andere teams en stakeholders
        coverage:
          - publisher: NU.nl
            title: "12 oktober 2026: Veiligheidsincident bij Albert Heijn verstoort bezorging en winkelsystemen"
            url: https://www.nu.nl/economie/6412835/veiligheidsincident-bij-albert-heijn-geen-bezorging-en-oude-prijzen-in-winkel.html
          - publisher: RTL Nieuws
            title: "12 oktober 2026: Distributiecentra van Albert Heijn liggen plat door de storing"
            url: https://www.rtl.nl/nieuws/economie/artikel/5658604/chaos-albert-heijn-bevoorrading-distributiecentra-plat
          - publisher: Ahold Delhaize
            title: "19 oktober 2026: Officiële update over het cybersecurity-incident en het herstel van diensten"
            url: https://newsroom.aholddelhaize.com/ahold-delhaize-update-on-status-of-cybersecurity-incident/
      description: >-
        Ik ben de enige Kotlin-ontwikkelaar in een team van Salesforce-beheerders en -ontwikkelaars.
        Ik richt me op het moderniseren van onze microservices en Kafka-integraties, met interne frameworks
        en code die eenvoudiger te onderhouden is.

        Daarnaast vertegenwoordig ik het team in architectuuroverleggen en help ik onze werkwijze te verbeteren
        met pair programming, kwaliteitscontroles en kennisdeling. Naast de dagelijkse ontwikkeling denk ik mee
        over onze technische backlog en roadmap.
      start: 01-08-2024
      end:
