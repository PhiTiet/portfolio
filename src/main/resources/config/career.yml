  events:
    - employer: DEEN Distribution Centre
      job-title:
        en: Storage employee
        nl: Magazijnmedewerker
      description:
        en: My first job was as an order picker at DEEN’s distribution centre.
        nl: Mijn eerste baan was als orderpicker bij het distributiecentrum van DEEN.
      start: 01-01-2015
      end: 01-06-2015

    - employer: McDonald's
      job-title:
        en: Crew member
        nl: Crewlid
      description:
        en: Working at McDonald’s taught me to keep up in a busy environment, communicate clearly, and work closely
          with a team. It was my first experience in hospitality.
        nl: Bij McDonald's leerde ik om mee te komen in een drukke omgeving, duidelijk te communiceren en goed samen
          te werken. Het was mijn eerste ervaring in de horeca.
      start: 01-06-2015
      end: 01-01-2016

    - employer: Lunchroom Cafetaria Celine
      job-title:
        en: All-around employee
        nl: Allround medewerker
      description:
        en: I worked in an all-round role at Celine, helping with the day-to-day running of the lunchroom. High
          expectations taught me to stay organised, work efficiently, and take responsibility for my work.
        nl: Bij Celine werkte ik als allround medewerker en hielp ik de lunchroom dagelijks draaiende te houden. De
          hoge verwachtingen leerden me om georganiseerd en efficiënt te werken en verantwoordelijkheid te
          nemen voor mijn werk.
      start: 01-01-2016
      end: 01-01-2020

    - employer: MedIT Solutions B.V.
      job-title: Junior Software Engineer
      description:
        en: I started my software engineering career at MedIT, working on MediCheck, a web and mobile app for
          medication management in nursing homes. It’s where I put Java and Spring into practice, learned to
          work in a Scrum team, and saw how our software supported care teams in their daily work.
        nl: Mijn loopbaan als software engineer begon bij MedIT, waar ik werkte aan MediCheck, een web- en mobiele app
          voor medicatiebeheer in verpleeghuizen. Daar bracht ik Java en Spring in de praktijk, leerde ik
          samenwerken in een Scrum-team en zag ik hoe onze software zorgteams hielp bij hun dagelijkse werk.
      start: 01-09-2020
      end: 01-07-2022

    - employer: Ordina
      job-title: Medior Software Engineer
      description:
        en: "I joined Ordina as a Medior Software Engineer, working on assignment at Rabobank. The role introduced me
          to consultancy: joining a client team, getting to know their systems, and adapting to their way of
          working."
        nl: "Ik begon bij Ordina als Medior Software Engineer, met een opdracht bij Rabobank. Daar maakte ik kennis
          met consultancy: aansluiten bij een klantteam, de systemen leren kennen en me aanpassen aan hun
          manier van werken."
      start: 01-07-2022
      end: 01-04-2024

    - employer: Rabobank
      job-title: Medior Software Engineer
      description:
        en: I built and maintained services for MED, a mortgage dashboard used by advisors and customers to plan
          mortgages, share documents, track progress, and stay in touch. Working in a microservices
          environment also gave me hands-on experience with Kubernetes, Azure, and DevOps.
        nl: Ik bouwde en onderhield services voor MED, een hypotheekdashboard waarmee adviseurs en klanten hypotheken
          kunnen plannen, documenten delen, de voortgang volgen en contact houden. Werken in een
          microservices-omgeving gaf me ook praktische ervaring met Kubernetes, Azure en DevOps.
      start: 01-09-2022
      end: 01-04-2024

    - employer: Qualogy
      job-title: Senior Software Engineer
      description:
        en: I joined Qualogy as a Senior Software Engineer, with my first assignment at Ahold Delhaize. Alongside
          client work, I’ve contributed to internal projects, helped assess candidates through interviews and
          coding assignments, and organised knowledge-sharing sessions.
        nl: Ik begon bij Qualogy als Senior Software Engineer, met mijn eerste opdracht bij Ahold Delhaize. Naast
          klantopdrachten heb ik bijgedragen aan interne projecten, meegeholpen bij het beoordelen van
          kandidaten via gesprekken en programmeeropdrachten, en kennissessies georganiseerd.
      start: 01-04-2024

    - employer: Ahold Delhaize
      job-title: Senior Software Engineer
      highlight:
        summary:
          en: I was selected as a core developer to help restore our cloud landscape during the Albert Heijn outage in
            October 2026.
          nl: Ik werd geselecteerd als core developer om ons cloudlandschap te helpen herstellen tijdens de storing bij
            Albert Heijn in oktober 2026.
        responsibilities:
          - en: Mitigate vulnerabilities
            nl: Kwetsbaarheden mitigeren
          - en: Rotate secrets
            nl: Secrets roteren
          - en: Scale services up and down
            nl: Services op- en afschalen
          - en: Restore connectivity in Kubernetes
            nl: Connectiviteit binnen Kubernetes herstellen
          - en: Communicate with other teams and stakeholders
            nl: Afstemmen met andere teams en stakeholders
        coverage:
          - publisher: NU.nl
            title:
              en: "12 October 2026: Security incident at Albert Heijn disrupts deliveries and store systems"
              nl: "12 oktober 2026: Veiligheidsincident bij Albert Heijn verstoort bezorging en winkelsystemen"
            url: https://www.nu.nl/economie/6412835/veiligheidsincident-bij-albert-heijn-geen-bezorging-en-oude-prijzen-in-winkel.html
          - publisher: RTL Nieuws
            title:
              en: "12 October 2026: Albert Heijn distribution centres disrupted by the outage"
              nl: "12 oktober 2026: Distributiecentra van Albert Heijn liggen plat door de storing"
            url: https://www.rtl.nl/nieuws/economie/artikel/5658604/chaos-albert-heijn-bevoorrading-distributiecentra-plat
          - publisher: Ahold Delhaize
            title:
              en: "19 October 2026: Official update on the cybersecurity incident and service restoration"
              nl: "19 oktober 2026: Officiële update over het cybersecurity-incident en het herstel van diensten"
            url: https://newsroom.aholddelhaize.com/ahold-delhaize-update-on-status-of-cybersecurity-incident/
      description:
        en: >-
          I’m the only Kotlin developer in a team of Salesforce admins and developers. My work focuses on
          modernising our microservices and Kafka integrations, using internal frameworks and making the code
          easier to maintain.

          I also represent the team in architecture discussions and help improve how we work through pair
          programming, quality checks, and knowledge sharing. Alongside day-to-day development, I help shape
          our technical backlog and roadmap.
        nl: >-
          Ik ben de enige Kotlin-ontwikkelaar in een team van Salesforce-beheerders en -ontwikkelaars. Ik
          richt me op het moderniseren van onze microservices en Kafka-integraties, met interne frameworks en
          code die eenvoudiger te onderhouden is.

          Daarnaast vertegenwoordig ik het team in architectuuroverleggen en help ik onze werkwijze te
          verbeteren met pair programming, kwaliteitscontroles en kennisdeling. Naast de dagelijkse
          ontwikkeling denk ik mee over onze technische backlog en roadmap.
      start: 01-08-2024

