server.port: 8080

spring:
  threads.virtual.enabled: true
  config:
    import:
      - classpath:/config/career.yml
      - classpath:/config/recommendations.yml
  web:
    resources:
      cache:
        period: 365d
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
  jackson:
    default-property-inclusion: non_null

portfolio:
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true
