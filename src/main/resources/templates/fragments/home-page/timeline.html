<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>

<body>
<div th:fragment="timeline" class="section-layout">
    <div class="section-heading">
        <span class="badge mb-4" th:text="#{experience.badge}">Career Journey</span>
        <h2 id="experience-heading" class="section-title" th:text="#{experience.title}">Work Experience</h2>
        <p class="section-description" th:text="#{experience.description}">
            From hospitality roots to senior engineering roles — every step shaped who I am today.
        </p>
    </div>

    <div class="timeline">
        <details th:each="event, iterStat : ${details.events}" class="career-entry" th:open="${iterStat.first}"
                 th:id="${'timeline-' + #strings.toLowerCase(#strings.substringBefore(event.employer + ' ', ' '))}">
            <summary>
                <span class="career-date" th:text="${#temporals.format(event.start, 'MM.yyyy') + ' — ' + (event.end != null ? #temporals.format(event.end, 'MM.yyyy') : #messages.msg('timeline.current'))}"></span>
                <span class="career-role"><span class="career-employer" th:text="${event.employer}"></span><span th:text="${event.jobTitle}"></span></span>
                <span class="disclosure-icon" aria-hidden="true">+</span>
            </summary>
            <div class="career-description">
                <div th:replace="~{fragments/home-page/career-highlight :: highlight(${event.highlight}, false)}"></div>
                <p th:text="${event.description}"></p>
                <a th:if="${#strings.contains('Ahold Delhaize,Rabobank,Qualogy,MedIT Solutions B.V.', event.employer)}"
                   th:href="${'#project-' + #strings.toLowerCase(#strings.substringBefore(event.employer + ' ', ' '))}"
                   class="project-timeline-link" th:text="#{projects.view.project}">View project</a>
            </div>
        </details>
    </div>
</div>
</body>

</html>
