<section xmlns:th="http://www.thymeleaf.org"
         th:fragment="errorPage(status, heading, message)"
         class="min-h-[70vh] flex items-center justify-center py-[var(--spacing-section)]">
    <div class="container">
        <div class="max-w-lg mx-auto text-center">
            <p class="text-6xl font-bold text-[var(--color-accent)] mb-4" th:text="${status}">404</p>
            <h1 class="text-2xl font-bold text-[var(--color-text-primary)] mb-4" th:text="${heading}">Page Not Found</h1>
            <p class="text-[var(--color-text-secondary)] mb-8" th:text="${message}">
                The page you're looking for doesn't exist or has been moved.
            </p>
            <a href="/" class="btn-accent inline-flex items-center gap-2 py-2.5 px-5 font-medium text-sm rounded-[var(--radius-md)]">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                </svg>
                <span th:text="#{error.back.home}">Back to Home</span>
            </a>
        </div>
    </div>
</section>
